version: '3.8'

# Production Docker Compose file
# This file pulls images from Docker Hub instead of building locally
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nhs-waitlist-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nhs_waitlist}
      POSTGRES_USER: ${POSTGRES_USER:-nhs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nhs_password}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./create-all-tables.sql:/docker-entrypoint-initdb.d/create-all-tables.sql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nhs_user} -d ${POSTGRES_DB:-nhs_waitlist}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nhs-network
    restart: unless-stopped

  # NHS Waitlist Application
  # Replace 'your-dockerhub-username' with your actual Docker Hub username
  app:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/nhs-waitlist:${IMAGE_TAG:-latest}
    container_name: nhs-waitlist-app
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nhs_user}:${POSTGRES_PASSWORD:-nhs_password}@postgres:5432/${POSTGRES_DB:-nhs_waitlist}
      SESSION_SECRET: ${SESSION_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_DEFAULT_CURRENCY: ${STRIPE_DEFAULT_CURRENCY:-usd}
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nhs-network
    restart: unless-stopped
    volumes:
      - app_logs:/app/logs

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local

networks:
  nhs-network:
    driver: bridge

