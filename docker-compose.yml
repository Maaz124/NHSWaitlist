version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: nhs-waitlist-db:latest
    container_name: nhs-waitlist-db
    environment:
      POSTGRES_DB: nhs_waitlist
      POSTGRES_USER: nhs_user
      POSTGRES_PASSWORD: nhs_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhs_user -d nhs_waitlist"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nhs-network
    restart: unless-stopped

  # NHS Waitlist Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nhs-waitlist-app:latest
    container_name: nhs-waitlist-app
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://nhs_user:nhs_password@postgres:5432/nhs_waitlist
      SESSION_SECRET: your-super-secret-session-key-change-this-in-production
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_your_stripe_secret_key}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_your_stripe_publishable_key}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nhs-network
    restart: unless-stopped
    volumes:
      - app_logs:/app/logs

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local

networks:
  nhs-network:
    driver: bridge
